cdc_fb_sp_marketing:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  
  meta:
    base: &base
      type: databricks
      threads: 8
    base_auth: &base_auth
      type: databricks
      auth_type: oauth
      client_id: "{{ env_var('DBX_ID_APPLICATION_ID') }}"
      client_secret: "{{ env_var('DBX_SECRET') }}"
      threads: 8
      connect_retries: 30
      retry_all: true

  outputs:
    dev: &dev
      <<: *base
      host: dbc-ea1fb91a-7069.cloud.databricks.com
      token: "{{ env_var('DATABRICKS_PAT_TOKEN') }}"
      catalog: "{{ env_var('DEV_CATALOG') }}"
      schema: "{{ env_var('DEV_SCHEMA') }}"
      http_path: /sql/1.0/warehouses/2d8cb33bab9dbcd6

    ci: &ci_service_account
      <<: *base_auth
      catalog: ci_godwin
      schema: "{{ env_var('DEV_SCHEMA') }}"
      host:  dbc-ea1fb91a-7069.cloud.databricks.com
      http_path: /sql/1.0/warehouses/2d8cb33bab9dbcd6


    production: &production_service_account
      <<: *base_auth
      catalog: prod_godwin
      schema: analytics
      host: dbc-ea1fb91a-7069.cloud.databricks.com
      http_path: /sql/1.0/warehouses/2d8cb33bab9dbcd6

      
## DATABRICKS ##
## By default, edr expects the profile name 'elementary'.      ##
## Configure the database and schema of elementary models.     ##
## Check where 'elementary_test_results' is to find it.        ##

elementary:
  outputs:
    production:
      <<: *production_service_account
      catalog: prod_godwin
      schema:  "{{ env_var('DEV_SCHEMA') }}_elementary"
      
    dev:
      <<: *dev
      schema: "{{ env_var('DEV_SCHEMA') }}_elementary"

    ci:
      <<: *ci_service_account
      schema: "{{ env_var('DEV_SCHEMA') }}_elementary"